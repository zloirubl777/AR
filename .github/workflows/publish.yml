name: Publish POLIGON + SOLO AR
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare site and bundle dependencies locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/solo/vendor _site/vendor/wasm _site/vendor/models
          cp index.html _site/index.html
          cp -a solo/index.html solo/game.js _site/solo/
          npm install --no-save --ignore-scripts --no-audit --no-fund three@0.180.0 @mediapipe/tasks-vision@0.10.21
          cp node_modules/three/build/three.core.js _site/solo/vendor/three.core.js
          cp node_modules/three/build/three.module.js _site/solo/vendor/three.module.js
          cp node_modules/@mediapipe/tasks-vision/vision_bundle.mjs _site/vendor/vision_bundle.mjs
          cp node_modules/@mediapipe/tasks-vision/wasm/* _site/vendor/wasm/
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task' -o _site/vendor/models/pose_landmarker_lite.task
          test "$(stat -c%s _site/vendor/vision_bundle.mjs)" -gt 100000
          test "$(stat -c%s _site/solo/vendor/three.module.js)" -gt 100000
          printf '{"engine":"mediapipe-pose-0.10.21","build":"03.0"}\n' > _site/vendor/ready.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
