name: Publish POLIGON with local AI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download official MediaPipe and model into the deployed site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/vendor/wasm _site/vendor/models _temp_mp
          cp index.html _site/index.html
          cd _temp_mp
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund --save-exact @mediapipe/tasks-vision@0.10.21
          cp node_modules/@mediapipe/tasks-vision/vision_bundle.mjs ../_site/vendor/vision_bundle.mjs
          cp node_modules/@mediapipe/tasks-vision/wasm/* ../_site/vendor/wasm/
          cd ..
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" \
            --output _site/vendor/models/pose_landmarker_lite.task
          test "$(stat -c%s _site/vendor/vision_bundle.mjs)" -gt 200000
          test "$(stat -c%s _site/vendor/models/pose_landmarker_lite.task)" -gt 1000000
          test -f _site/vendor/wasm/vision_wasm_internal.js
          test -f _site/vendor/wasm/vision_wasm_internal.wasm
          test -f _site/vendor/wasm/vision_wasm_nosimd_internal.js
          test -f _site/vendor/wasm/vision_wasm_nosimd_internal.wasm
          printf '{"engine":"mediapipe-pose-0.10.21","build":"02.5"}\n' > _site/vendor/ready.json
          echo "Published vendor assets:"; du -ah _site/vendor | sort -h | tail -12

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
